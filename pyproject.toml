[project]
name = "juena"
authors = [
    {name = "Ahmad Z. Ihsan", email = "a.ihsan@fz-juelich.de"}
]
version = "1.0.0"
description = "A general-purpose chatbot template for building LangGraph-based chatbots"
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    # The shared infrastructure: server, agent kit, persistence, client, the
    # Streamlit shell and the optional Podman sandbox. It also owns the
    # LangChain-family version bounds validated together in juena-core's CP0b.
    "juena-core[ui,mcp,sandbox]",
    # Imported directly by the modules that stay in this application. Declared
    # without duplicate bounds on purpose: core constrains the shared framework
    # family and this application's uv.lock pins the whole resolved set. A
    # second framework bound here could contradict core; the pre-cutover
    # `deepagents==0.6.12` was exactly that contradiction -- unsatisfiable
    # against core's `>=0.7.13,<0.8`.
    "deepagents",
    "langchain",
    "langchain-core",
    "langgraph",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "httpx-sse",
    "sqlalchemy[asyncio]",
    "pydantic",
    "pyyaml",
    "pillow",
    # Session-scoped stream ownership and cleanup require Streamlit 1.64.
    "streamlit>=1.64.0",
    # Neither of these is core's: web search and SAML are JüNA's alone.
    "langchain-tavily",
    "python-dotenv>=1.0.0",
    "cryptography",
    "pysaml2==7.5.4",
    # The retrieval store, over HTTP. The `client` extra is httpx only -- no
    # database driver and no embedder, because the service does both.
    "juena-rag[client]",
    # Self-hosted tracing, switched on by LANGFUSE_TRACING. The floor is the
    # version whose span propagation tests/test_langfuse_tracing.py verifies.
    "langfuse>=4.17,<5",
]

[project.optional-dependencies]
services = ["juena-rag[serve,ingest]"]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.1",
    "tifffile==2025.5.10",
    "imagecodecs==2025.3.30",
    "matplotlib==3.10.8",
    "numpy==2.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Immutable revisions; publish new core commits before remote builds.
[tool.uv.sources]
juena-core = { git = "https://github.com/neutron-simlab/juena-core.git", rev = "b23e16b37bb56e1e0f187f6866931dd68dd1a76b" }
juena-rag = { git = "https://github.com/neutron-simlab/juena-rag.git", rev = "db98edd752967a48ef49fd61f7ee53ad47bcc23c" }

[tool.hatch.build.targets.wheel]
packages = ["src/juena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::langchain_core._api.deprecation.LangChainDeprecationWarning",
]
