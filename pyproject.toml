[project]
name = "juena"
authors = [
    {name = "Ahmad Z. Ihsan", email = "a.ihsan@fz-juelich.de"}
]
version = "0.1.0"
description = "A general-purpose chatbot template for building LangGraph-based chatbots"
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "langchain[openai]>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-tavily",
    "langchain-mcp-adapters>=0.1.9",
    "langgraph>=1.0.0",
    "deepagents==0.6.12",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "httpx-sse>=0.4.0",
    "sse-starlette>=2.0.0",
    # 1.53 is the floor for `st.chat_input(max_upload_size=...)`, used by the composer.
    "streamlit>=1.53.0",
    "pydantic[all]>=2.11.2,<3.0.0",
    "python-dotenv>=1.0.0",
    "langgraph-checkpoint-postgres==3.1.0",
    "psycopg[binary,pool]==3.3.4",
    "sqlalchemy[asyncio]==2.0.48",
    "pysaml2==7.5.4",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "podman>=5.8.0",
    # The retrieval store, over HTTP. The `client` extra is httpx only -- no
    # database driver and no embedder, because the service does both.
    "juena-rag[client] @ git+https://github.com/neutron-simlab/juena-rag.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# juena-rag is installed straight from git -- it is not on PyPI, and hatchling
# refuses a direct reference unless this says so.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/juena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::langchain_core._api.deprecation.LangChainDeprecationWarning",
]
