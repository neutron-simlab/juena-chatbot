  - id: datreat
    name: Datreat
    description: "Fortran codebase with a different structure than Python projects (index and answer from source + docs)."
    source:
      url: https://github.com/birkenfeld/datreat.git
      branch: master
    include_globs:
      - "**/*.f"
      - "**/*.F"
      - "**/*.for"
      - "**/*.FOR"
      - "**/*.f90"
      - "**/*.F90"
      - "**/*.f95"
      - "**/*.F95"
      - "**/*.f03"
      - "**/*.F03"
      - "**/*.inc"
      - "**/*.INC"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.rst"
      - "**/*.tex"
      - "**/Makefile"
      - "**/makefile"
      - "**/*.mk"
      - "**/*.MK"
    exclude_globs:
      - "**/node_modules/**"
      - "**/.git/**"
      - "**/__pycache__/**"
      - "**/.venv/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/*.o"
      - "**/*.a"
      - "**/*.so"
    max_file_bytes: 524288          # 512 KB
    chunk_size: 1500
    chunk_overlap: 200
    docs_paths:
      - "README.md"
      - "doc/"

