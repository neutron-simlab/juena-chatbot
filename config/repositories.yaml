# Repository registry for the code-chat agent.
# Each entry describes one software project that the agent can search and answer
# questions about.  Add new software by appending another block.
#
# Fields:
#   id            – unique slug (used in API + vector store namespace)
#   name          – human-readable display name
#   description   – short blurb shown to users / used in tool descriptions
#   source.url    – Git clone URL (HTTPS or SSH)
#   source.branch – branch to track (default: main)
#   include_globs – file patterns to index (default: all text files)
#   exclude_globs – patterns to skip
#   max_file_bytes– skip files larger than this (default: 512 KB)
#   chunk_size    – characters per chunk for embedding (default: 1500)
#   chunk_overlap – overlap between chunks (default: 200)
#   docs_paths    – paths inside the repo treated as documentation

repositories:

