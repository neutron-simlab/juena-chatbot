# =============================================================================
# DOCKER COMPOSE CONFIGURATION FOR juena-chatbot
# =============================================================================
# Production-oriented base configuration. Local development explicitly merges
# docker-compose.dev.yml after this file.
#
# Usage:
#   Development: docker compose -f docker-compose.yml \
#                  -f docker-compose.dev.yml up -d
#   Production:  docker compose -f docker-compose.yml \
#                  --env-file /etc/juena/juena.env up -d
#
# Security:
#   - Never commit .env files with actual secrets
#   - Production secrets should be managed securely (e.g., Docker secrets, env files)
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-juena}
      - POSTGRES_USER=${POSTGRES_USER:-juena}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    volumes:
      - chatbot-postgres:/var/lib/postgresql/data
    # Intentionally not published. The development override exposes Postgres
    # to localhost for integration tests.
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juena} -d ${POSTGRES_DB:-juena}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  juena-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: juena-chatbot:latest
    container_name: juena-chatbot
    volumes:
      # Mount logs directory for persistence
      - chatbot-logs:/data/logs
      # Preserve pre-cutover anonymous SQLite files as a read-only archive.
      - chatbot-db:/data/legacy-sqlite:ro
      # Persist cloned repos, vector index, and manifests across restarts
      - chatbot-repos:/data/repos
      - chatbot-vector-index:/data/vector_index
      - chatbot-manifests:/data/manifests
      - chatbot-saml:/data/saml
      # Skills are baked into the image (see Dockerfile). For local authoring,
      # docker-compose.dev.yml bind-mounts ./skills over them so you can
      # edit without rebuilding; the image copy is what production runs.
    environment:
      # Server configuration
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - UI_PORT=9501
      
      # LLM Provider configuration (from .env)
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-openai}
      - FALLBACK_PROVIDER=${FALLBACK_PROVIDER:-openai}
      - OPENAI_DEFAULT_MODEL=${OPENAI_DEFAULT_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BLABLADOR_API_KEY=${BLABLADOR_API_KEY:-}
      - BLABLADOR_BASE_URL=${BLABLADOR_BASE_URL:-}
      
      # LLM Settings
      - MAX_TOKENS=${MAX_TOKENS:-10000}
      - TIMEOUT_SECONDS=${TIMEOUT_SECONDS:-60}
      - MAX_RETRIES=${MAX_RETRIES:-3}

      # Context7 MCP (optional)
      - CONTEXT7_API_KEY=${CONTEXT7_API_KEY:-}
      - CONTEXT7_MCP_URL=${CONTEXT7_MCP_URL:-https://mcp.context7.com/mcp}
      - CONTEXT7_TIMEOUT_SECONDS=${CONTEXT7_TIMEOUT_SECONDS:-30}

      # Tavily web search (optional)
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      
      # LangSmith Tracing (optional)
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-juena-chatbot}
      
      # Environment settings
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/data/logs
      - RELOAD=${RELOAD:-false}
      
      # Durable identity, chat, checkpoints, and long-term memory.
      - DATABASE_URL=${DATABASE_URL:-}
      - LEGACY_SQLITE_ARCHIVE_DIR=/data/legacy-sqlite

      # FZJ SAML2 service provider.
      - SAML_IDP_METADATA_URL=${SAML_IDP_METADATA_URL:-https://ifflogin.fz-juelich.de/saml/idp.xml}
      - SAML_SP_ENTITY_ID=${SAML_SP_ENTITY_ID:-}
      - SAML_SP_ACS_URL=${SAML_SP_ACS_URL:-}
      - SAML_SP_SLS_URL=${SAML_SP_SLS_URL:-}
      - SAML_SP_CERT_FILE=${SAML_SP_CERT_FILE:-/data/saml/sp.crt}
      - SAML_SP_KEY_FILE=${SAML_SP_KEY_FILE:-/data/saml/sp.key}
      - JUENA_API_INTERNAL_URL=http://localhost:8080
      - JUENA_PUBLIC_URL=${JUENA_PUBLIC_URL:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - SKILLS_DIR=/app/skills
      
      # Code-chat agent settings
      - REPO_CACHE_DIR=/data/repos
      - VECTOR_INDEX_DIR=/data/vector_index
      - INDEX_MANIFEST_DIR=/data/manifests
    ports:
      - "8080:8080"  # FastAPI server
      - "9501:9501"  # Streamlit UI
    networks:
      - chatbot-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Repository bootstrap builds several large HNSW indices in one process.
    # The previous 2 GB cap killed the process part-way through Vitess and left
    # its Chroma collection unreadable. Keep this configurable for smaller or
    # larger hosts, but give the documented development/VM setup enough room.
    mem_limit: ${JUENA_MEMORY_LIMIT:-12G}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: ${JUENA_MEMORY_LIMIT:-12G}
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  chatbot-logs:
    driver: local
    name: juena-chatbot-logs
  chatbot-db:
    driver: local
    name: juena-chatbot-db
  chatbot-postgres:
    driver: local
    name: juena-chatbot-postgres
  chatbot-repos:
    driver: local
    name: juena-chatbot-repos
  chatbot-vector-index:
    driver: local
    name: juena-chatbot-vector-index
  chatbot-manifests:
    driver: local
    name: juena-chatbot-manifests
  chatbot-saml:
    driver: local
    name: juena-chatbot-saml

networks:
  chatbot-network:
    driver: bridge
    name: juena-chatbot-network
