# =============================================================================
# DOCKER COMPOSE CONFIGURATION FOR juena-chatbot
# =============================================================================
# Production-oriented base configuration. Local development explicitly merges
# docker-compose.dev.yml after this file.
#
# Usage:
#   Development: docker compose -f docker-compose.yml \
#                  -f docker-compose.dev.yml up -d
#   Production:  docker compose -f docker-compose.yml \
#                  --env-file /etc/juena/juena.env --profile server up -d
#
# Security:
#   - Never commit .env files with actual secrets
#   - Production secrets should be managed securely (e.g., Docker secrets, env files)
# =============================================================================

name: juena-chatbot

x-app-image: &app-image
  image: ${JUENA_IMAGE:-juena-chatbot:local}
  build:
    context: .
    target: runtime

x-rag: &rag
  <<: *app-image
  entrypoint: ["juena-rag"]
  environment: &rag-environment
    JUENA_RAG_DSN: postgresql://${RAG_POSTGRES_USER:-juena_rag}:${RAG_POSTGRES_PASSWORD:?set RAG_POSTGRES_PASSWORD}@rag-db:5432/${RAG_POSTGRES_DB:-juena_rag_corpus}
    BLABLADOR_API_KEY: ${BLABLADOR_API_KEY:-}
    BLABLADOR_BASE_URL: ${BLABLADOR_BASE_URL:-https://api.blablador.fz-juelich.de/v1}
    BLABLADOR_EMBEDDING_MODEL: ${BLABLADOR_EMBEDDING_MODEL:-alias-qwen3-8b-embeddings}
    BLABLADOR_EMBEDDING_DIMENSION: ${BLABLADOR_EMBEDDING_DIMENSION:-4096}
    JUENA_RAG_POOL_MAX_SIZE: 4
    JUENA_RAG_MAX_CONCURRENCY: 8
  networks: [chatbot-network]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-juena}
      - POSTGRES_USER=${POSTGRES_USER:-juena}
      # Required, with no default on purpose. `${VAR:-}` supplied an empty
      # password silently: `docker compose config` rendered it without even a
      # warning, and the failure only appeared later as a health-check timeout
      # on a container that refused to initialise. `${VAR:?}` fails at config
      # time with this message instead. See env.example.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your env file (see env.example)}
    volumes:
      - chatbot-postgres:/var/lib/postgresql/data
    # The host worker is the only non-container database client.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    mem_limit: 512m
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juena} -d ${POSTGRES_DB:-juena}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  juena-chatbot:
    <<: *app-image
    volumes:
      # Mount logs directory for persistence
      - chatbot-logs:/data/logs
      # Persist the cloned working trees across restarts. No index volume: the
      # vectors live in juena-rag, and the clone is only here so the model can
      # open a real file and quote real line numbers.
      - chatbot-repos:/data/repos
      - ${JUENA_SAML_DIR:-chatbot-saml}:/data/saml:ro
      # Chat artifacts are immutable delivered snapshots. Current working files
      # persist separately in the shared conversation workspace below.
      - chatbot-artifacts:/data/artifacts
      - chatbot-audit:/data/audit
      # Persistent conversation files, also used when execution is disabled.
      # API and worker must share this storage and its filesystem locks.
      - ${SANDBOX_WORKSPACE_HOST_ROOT:-./.sandbox/workspaces}:/sandbox-workspaces
    environment:
      # Server configuration
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - UI_PORT=9501
      
      # LLM Provider configuration (from .env)
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-openai}
      - FALLBACK_PROVIDER=${FALLBACK_PROVIDER:-openai}
      - OPENAI_DEFAULT_MODEL=${OPENAI_DEFAULT_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BLABLADOR_API_KEY=${BLABLADOR_API_KEY:-}
      - BLABLADOR_BASE_URL=${BLABLADOR_BASE_URL:-https://api.blablador.fz-juelich.de/v1}
      # Compose DNS; the RAG service and its database are private.
      - JUENA_RAG_URL=http://juena-rag:8100

      - BLABLADOR_DEFAULT_MODEL=${BLABLADOR_DEFAULT_MODEL:-90 - Qwen 3.8-Flash-Next-125B-AWQ-W4A16 on Juwels Booster - An excellent model from September 2026}
      # LLM Settings
      - MAX_TOKENS=${MAX_TOKENS:-10000}
      - TIMEOUT_SECONDS=${TIMEOUT_SECONDS:-60}
      - MAX_RETRIES=${MAX_RETRIES:-3}

      # Context7 MCP (optional)
      - CONTEXT7_API_KEY=${CONTEXT7_API_KEY:-}
      - CONTEXT7_MCP_URL=${CONTEXT7_MCP_URL:-https://mcp.context7.com/mcp}
      - CONTEXT7_TIMEOUT_SECONDS=${CONTEXT7_TIMEOUT_SECONDS:-30}

      # Tavily web search (optional)
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}

      # Optional host-side rootless-Podman worker. No container socket is mounted
      # into this application container; the sandbox_jobs table is the only channel.
      - SANDBOX_ENABLED=${SANDBOX_ENABLED:-false}
      - SANDBOX_IDENTITY_SECRET=${SANDBOX_IDENTITY_SECRET:-}
      - SANDBOX_WORKSPACE_ROOT=/sandbox-workspaces
      # Must match the worker's own SANDBOX_CONCURRENCY: this is what the API
      # admits before it reports the sandbox busy.
      - SANDBOX_CONCURRENCY=${SANDBOX_CONCURRENCY:-1}
      - SANDBOX_EXECUTION_TIMEOUT_SECONDS=${SANDBOX_EXECUTION_TIMEOUT_SECONDS:-600}
      - SANDBOX_MAX_OUTPUT_BYTES=${SANDBOX_MAX_OUTPUT_BYTES:-100000}
      # The API puts these values in the approval card and uses the workspace
      # bounds locally; the host worker must receive the same environment.
      - SANDBOX_CPU_LIMIT=${SANDBOX_CPU_LIMIT:-1}
      - SANDBOX_MEMORY_LIMIT=${SANDBOX_MEMORY_LIMIT:-1g}
      - SANDBOX_WORKSPACE_LIMIT_BYTES=${SANDBOX_WORKSPACE_LIMIT_BYTES:-5368709120}
      - SANDBOX_IDLE_TTL_SECONDS=${SANDBOX_IDLE_TTL_SECONDS:-86400}
      - SANDBOX_ARTIFACT_ROOT=/data/artifacts
      - SANDBOX_AUDIT_FILE=/data/audit/sandbox.jsonl
      
      # LangSmith Tracing (optional)
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-juena-chatbot}

      # Self-hosted Langfuse tracing (optional; `./juena langfuse-up`). Inside
      # this container Langfuse is `http://langfuse:3000`, reached over the
      # optional tracing network -- not `localhost`, which is
      # this container's own loopback.
      - LANGFUSE_TRACING=${LANGFUSE_TRACING:-false}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}

      # Environment settings
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # Keep the documented one-shot SAML check executable:
      # `AUTH_DEV_BYPASS=false ./juena up`. Compose interpolation gives an
      # explicit shell value precedence over `.env`, and Config's dotenv load
      # then leaves this container environment value untouched.
      - AUTH_DEV_BYPASS=${AUTH_DEV_BYPASS:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/data/logs
      - RELOAD=${RELOAD:-false}
      
      # Durable identity, chat, checkpoints, and long-term memory.
      # Built here rather than inherited from the host environment. Compose
      # auto-loads the repository `.env`, whose DATABASE_URL is written for a
      # process running natively on the host and so points at `localhost` --
      # which inside this container means the container itself, not Postgres.
      # Inheriting it produced a connection-refused crash on startup that read
      # like a Postgres outage. Point POSTGRES_HOST at an external database to
      # use one instead of the bundled service.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-juena}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your env file (see env.example)}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-juena}

      # FZJ SAML2 service provider.
      - SAML_IDP_METADATA_URL=${SAML_IDP_METADATA_URL:-https://ifflogin.fz-juelich.de/saml/idp.xml}
      - SAML_IDP_METADATA_CERT_FILE=${SAML_IDP_METADATA_CERT_FILE:-}
      - SAML_METADATA_REFRESH_SECONDS=${SAML_METADATA_REFRESH_SECONDS:-21600}
      - SAML_ORGANIZATION_NAME=${SAML_ORGANIZATION_NAME:-}
      - SAML_ORGANIZATION_URL=${SAML_ORGANIZATION_URL:-}
      - SAML_CONTACT_NAME=${SAML_CONTACT_NAME:-}
      - SAML_CONTACT_EMAIL=${SAML_CONTACT_EMAIL:-}
      - SAML_SP_ENTITY_ID=${SAML_SP_ENTITY_ID:-}
      - SAML_SP_ACS_URL=${SAML_SP_ACS_URL:-}
      - SAML_SP_SLS_URL=${SAML_SP_SLS_URL:-}
      - SAML_SP_CERT_FILE=${SAML_SP_CERT_FILE:-/data/saml/sp.crt}
      - SAML_SP_KEY_FILE=${SAML_SP_KEY_FILE:-/data/saml/sp.key}
      - JUENA_API_INTERNAL_URL=http://localhost:8080
      - JUENA_PUBLIC_URL=${JUENA_PUBLIC_URL:-}
      - UI_PUBLIC_URL=${UI_PUBLIC_URL:-${JUENA_PUBLIC_URL:-}}
      - FORWARDED_ALLOW_IPS=*
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      # Code-chat agent settings
      - REPO_CACHE_DIR=/data/repos
    networks: [chatbot-network]
    depends_on:
      postgres:
        condition: service_healthy
      juena-rag:
        condition: service_healthy
        required: false
    restart: unless-stopped
    # Docker's default is 10 s before SIGKILL. main.py lets in-flight requests
    # take up to 10 s; research cancellation and the Langfuse flush come after.
    stop_grace_period: 30s
    # Combined API/UI allowance for the 8 GiB pilot; validate peak usage on the VM.
    mem_limit: ${JUENA_MEMORY_LIMIT:-3G}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: ${JUENA_MEMORY_LIMIT:-3G}
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health && curl -fsS http://localhost:9501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: ${JUENA_START_PERIOD:-10m}

  rag-db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${RAG_POSTGRES_USER:-juena_rag}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:?set RAG_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RAG_POSTGRES_DB:-juena_rag_corpus}
    volumes:
      - rag-postgres:/var/lib/postgresql
    networks: [chatbot-network]
    mem_limit: 1g
    shm_size: 256mb
    command: ["postgres", "-c", "maintenance_work_mem=256MB", "-c", "max_parallel_maintenance_workers=0"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rag-init:
    <<: *rag
    entrypoint: ["python", "-m", "juena.deployment.rag_init"]
    depends_on:
      rag-db:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  juena-rag:
    <<: *rag
    command: ["serve", "--host", "0.0.0.0", "--port", "8100"]
    depends_on:
      rag-init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 3

  rag-ingest:
    <<: *rag
    profiles: [tools]
    entrypoint: ["python", "-m", "juena.deployment.rag_ingest"]
    command: []
    volumes:
      - ./config/repositories.yaml:/app/config/repositories.yaml:ro
      - rag-repos:/data/rag-repos
    depends_on:
      rag-init:
        condition: service_completed_successfully
    mem_limit: 2g
    restart: "no"

  gateway:
    image: nginx:1.28-alpine
    profiles: [server]
    ports:
      - "${JUENA_HTTPS_BIND:-0.0.0.0}:${JUENA_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${JUENA_TLS_DIR:-./.tls}:/etc/nginx/tls:ro
    networks: [chatbot-network]
    depends_on:
      juena-chatbot:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m

volumes:
  chatbot-logs:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-juena-chatbot}-logs
  chatbot-postgres:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-juena-chatbot}-postgres
  chatbot-repos:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-juena-chatbot}-repos
  chatbot-saml:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-juena-chatbot}-saml
  chatbot-artifacts:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-juena-chatbot}-artifacts
  chatbot-audit:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-juena-chatbot}-audit

  rag-postgres:
  rag-repos:

networks:
  chatbot-network:
    driver: bridge
