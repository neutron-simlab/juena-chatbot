# Loaded inside nginx's http context.
# Example domains and TLS paths: customize installed copies before use.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;
ssl_protocols TLSv1.2 TLSv1.3;

# Reject unknown TLS names instead of serving an arbitrary application.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name juena.example.org;
    ssl_certificate /etc/nginx/tls/juena/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/juena/privkey.pem;
    ssl_password_file /etc/nginx/tls/juena/tls-password;
    client_max_body_size 100m;

    # Sent with every answer, error pages included (`always`). No `location`
    # below may add a header of its own: nginx would then drop all of these
    # for that location.
    server_tokens off;
    # Browsers remember to reach this host over HTTPS only.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # No other website may show JüNA inside a frame (older browsers read the
    # second header), so nobody can be tricked into a hidden click.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # The address bar holds the conversation id; keep it from other sites.
    # Not `no-referrer`: that makes the sign-out form arrive without an origin.
    add_header Referrer-Policy "same-origin" always;

    # Runtime DNS allows this gateway to start while JueNA is offline.
    set $juena_backend juena-app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ^~ /_stcore/ {
        proxy_pass http://$juena_backend:9501;
    }
    location ~ ^/(auth|chats|threads|artifacts|research)(/|$) {
        proxy_pass http://$juena_backend:8080;
    }
    location ~ ^/health$ {
        proxy_pass http://$juena_backend:8080;
    }
    location ~ ^/([^/]+/)?(stream|stream_with_files|resume)(/|$) {
        proxy_pass http://$juena_backend:8080;
    }
    location / {
        proxy_pass http://$juena_backend:9501;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name elab.example.org;
    ssl_certificate /etc/nginx/tls/elabftw/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/elabftw/privkey.pem;
    ssl_password_file /run/secrets/elab-tls-password;
    client_max_body_size 100m;

    set $elab_backend elabftw-web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;

    location / {
        proxy_pass http://$elab_backend:8080;
    }
}
