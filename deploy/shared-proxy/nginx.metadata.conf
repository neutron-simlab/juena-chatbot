# Loaded inside nginx's http context. Hostnames and TLS paths target iff1122.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;
ssl_protocols TLSv1.2 TLSv1.3;

# Reject unknown TLS names instead of serving an arbitrary application.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iff1122.iff.kfa-juelich.de;
    ssl_certificate /etc/nginx/tls/juena/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/juena/privkey.pem;
    ssl_password_file /etc/nginx/tls/juena/tls-password;
    client_max_body_size 100m;

    location = /auth/metadata {
        alias /etc/nginx/sp-metadata/sp.xml;
        types { }
        default_type text/xml;
        charset utf-8;
        add_header Content-Disposition 'inline; filename="metadata.xml"';
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        limit_except GET { deny all; }
    }
    location / {
        default_type text/plain;
        add_header Retry-After 3600 always;
        return 503 "JueNA is being configured.\n";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jcns-elabs.fz-juelich.de;
    ssl_certificate /etc/nginx/tls/elabftw/jcns-elabs-cert.pem;
    ssl_certificate_key /etc/nginx/tls/elabftw/jcns-elabs-key.pem;
    ssl_password_file /run/secrets/elab-tls-password;
    client_max_body_size 100m;

    set $elab_backend elabftw-web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;

    location / {
        proxy_pass http://$elab_backend:8080;
    }
}
