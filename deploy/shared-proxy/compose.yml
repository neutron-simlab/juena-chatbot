# Shared gateway, independent of both application Compose projects. Stage 1: eLabFTW.
name: juena-edge
services:
  edge:
    image: nginx:1.28-alpine
    ports:
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/elabftw/tls
        target: /etc/nginx/tls/elabftw
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/elabftw-secrets/tls-password
        target: /run/secrets/elab-tls-password
        read_only: true
        bind: {create_host_path: false}
    networks: [edge]
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  edge:
    external: true
    name: juena-edge
