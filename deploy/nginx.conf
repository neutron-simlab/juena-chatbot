map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    # For an encrypted key, supply a mode-0600 tls-password in JUENA_TLS_DIR
    # and enable this line (see SERVER.md):
    # ssl_password_file /etc/nginx/tls/tls-password;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # Sent with every answer, error pages included (`always`). No `location`
    # below may add a header of its own: nginx would then drop all of these
    # for that location.
    server_tokens off;
    # Browsers remember to reach this host over HTTPS only.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # No other website may show JüNA inside a frame (older browsers read the
    # second header), so nobody can be tricked into a hidden click.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # The address bar holds the conversation id; keep it from other sites.
    # Not `no-referrer`: that makes the sign-out form arrive without an origin.
    add_header Referrer-Policy "same-origin" always;

    # Resolve again after Compose recreates the application container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend juena-chatbot;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Streamlit's /_stcore/stream must win over /{agent_id}/stream below.
    location ^~ /_stcore/ {
        proxy_pass http://$backend:9501;
    }
    location ~ ^/(auth|chats|threads|artifacts|research)(/|$) {
        proxy_pass http://$backend:8080;
    }
    location ~ ^/health$ {
        proxy_pass http://$backend:8080;
    }
    location ~ ^/([^/]+/)?(stream|stream_with_files|resume)(/|$) {
        proxy_pass http://$backend:8080;
    }
    location / {
        proxy_pass http://$backend:9501;
    }
}
